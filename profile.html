
<!DOCTYPE html>
<html>
<head>
    <title>NexaGram Profile</title>
    <style>
        body {
            background: #f0eaff;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }
        .profile-box {
            background: white;
            max-width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }
        h1 { color: #6c35d4; }
        .avatar {
            background: #6c35d4;
            color: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
        }
        button, .choose-photo {
            background: #6c35d4;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-box">
        <h1>NexaGram</h1>
        <div class="avatar">
            <img id="profilePhoto" alt="Profile Photo"
                 style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="defaultAvatar">N</span>
        </div>
        <br>
        <label for="photoInput" class="choose-photo">Choose Photo</label>
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
        <h2 id="profileName">Your Name</h2>
        <p id="profileUsername">@yourusername</p>
        <p id="profileBio">Welcome to my NexaGram Profile!</p>
        <p>Posts: 0 | Followers: 0 | Following: 0</p>
        <button onclick="editProfile()">Edit Profile</button>
        <p><a href="index.html">Back to Home</a></p>
    </div>

<script>
    const photoInput = document.getElementById("photoInput");
    const profilePhoto = document.getElementById("profilePhoto");
    const defaultAvatar = document.getElementById("defaultAvatar");

    const savedPhoto = localStorage.getItem("nexaProfilePhoto");
    if (savedPhoto) {
        profilePhoto.src = savedPhoto;
        profilePhoto.style.display = "block";
        defaultAvatar.style.display = "none";
    }

    photoInput.addEventListener("change", function () {
        const file = photoInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function () {
                localStorage.setItem("nexaProfilePhoto", reader.result);
                profilePhoto.src = reader.result;
                profilePhoto.style.display = "block";
                defaultAvatar.style.display = "none";
            };
            reader.readAsDataURL(file);
        }
    });

    const savedName = localStorage.getItem("nexaProfileName");
    const savedBio = localStorage.getItem("nexaProfileBio");
    const savedUsername = localStorage.getItem("nexaProfileUsername");

    if (savedBio) document.getElementById("profileBio").textContent = savedBio;
    if (savedUsername) document.getElementById("profileUsername").textContent = "@" + savedUsername;
    if (savedName) document.getElementById("profileName").textContent = savedName;

    function editProfile() {
        const newBio = prompt("Write your Bio:");
        if (newBio && newBio.trim() !== "") {
            document.getElementById("profileBio").textContent = newBio;
            localStorage.setItem("nexaProfileBio", newBio);
        }

        const newName = prompt("Enter your new name:");
        if (newName && newName.trim() !== "") {
            document.getElementById("profileName").textContent = newName;
            localStorage.setItem("nexaProfileName", newName);
        }

        const newUsername = prompt("Enter your new username:");
        if (newUsername && newUsername.trim() !== "") {
            document.getElementById("profileUsername").textContent = "@" + newUsername;
            localStorage.setItem("nexaProfileUsername", newUsername);
        }
    }
</script>
</body>
</html>

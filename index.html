
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaGram - Connect with Everyone</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #222;
        }

        header {
            background: #6c3df4;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #6c3df4;
            text-decoration: none;
            margin: 12px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
        }

        button {
            background: #6c3df4;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
    NexaGram
    <div style="margin-top:15px;">
        <a href="login.html"><button>Login</button></a>
        <a href="signup.html"><button>Sign Up</button></a>
        <a href="profile.html"><button>My Profile</button></a>
    </div>
</header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Explore</a>
        <a href="#">Profile</a>
    </nav>

    <div class="container">

        <div class="card">
            <h2>Welcome to NexaGram!</h2>
            <p>Connect with people. Share your world.</p>
        </div>

        <div class="card">
            <h2>Create a Post</h2>
            <input type="text" id="postText"
                   placeholder="What's on your mind?">
            <button onclick="addPost()">Share Post</button>
        </div>

        <div id="posts">
            <div class="card">
                <h3>NexaGram</h3>
                <p>Your social world starts here!</p>
            </div>
        </div>

    </div>

    <footer>© 2026 NexaGram</footer>

    <script>
        function addPost() {
            let text = document.getElementById("postText").value;

            if (text.trim() === "") {
                alert("Please write something first!");
                return;
            }

            let post = document.createElement("div");
            post.className = "card";

            let heading = document.createElement("h3");
            heading.textContent = "New Post";

            let paragraph = document.createElement("p");
            paragraph.textContent = text;

            post.appendChild(heading);
            post.appendChild(paragraph);

            document.getElementById("posts").prepend(post);
            document.getElementById("postText").value = "";
        }
    </script>

</body>
</html>
